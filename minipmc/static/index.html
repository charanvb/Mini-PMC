<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini PMC</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1d2733; --mute:#6b7785; --line:#dde3ea; --brand:#0b5cad;
          --ok:#1e8e3e; --warn:#b26a00; --bad:#c5221f; --run:#34a853; --stop:#e8eaed; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:10px 20px; display:flex; align-items:center; gap:18px; }
  header h1 { font-size:18px; margin:0; } header .sp { flex:1; }
  nav button { background:none; border:0; color:#cfe2f7; padding:8px 12px; cursor:pointer; font-size:14px; border-radius:4px; }
  nav button.on { background:#fff2; color:#fff; }
  main { padding:18px 20px; max-width:1400px; margin:auto; }
  .banner { padding:10px 14px; border-radius:6px; margin-bottom:14px; font-weight:600; }
  .banner.paused { background:#fde7e7; color:var(--bad); } .banner.live { background:#e6f4ea; color:var(--ok); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card b { display:block; font-size:24px; } .card span { color:var(--mute); font-size:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:16px; }
  .panel h3 { margin:0 0 10px; font-size:15px; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mute); font-weight:600; font-size:12px; text-transform:uppercase; position:sticky; top:0; background:var(--card); }
  tr:hover td { background:#f8fafc; }
  .bar { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
  input, select, textarea { padding:6px 8px; border:1px solid var(--line); border-radius:4px; font:inherit; background:#fff; }
  button.b { padding:6px 12px; border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:4px; cursor:pointer; font:inherit; }
  button.b.sec { background:#fff; color:var(--brand); } button.b.red { background:var(--bad); border-color:var(--bad); }
  button.b.sm { padding:2px 8px; font-size:12px; margin-right:4px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef1f5; }
  .tag.run { background:#e6f4ea; color:var(--ok); } .tag.stop { background:#eef1f5; color:var(--mute); }
  .tag.hold { background:#fff4e0; color:var(--warn); } .tag.bad { background:#fde7e7; color:var(--bad); }
  .mute { color:var(--mute); } .err { color:var(--bad); min-height:18px; }
  .login { max-width:320px; margin:90px auto; } .login input { width:100%; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:36px repeat(96, 1fr); gap:1px; font-size:10px; margin:2px 0; }
  .grid i { height:16px; background:var(--stop); } .grid i.R { background:var(--run); } .grid i.l { background:none; line-height:16px; font-style:normal; }
  .hours { display:grid; grid-template-columns:36px repeat(24, 1fr); font-size:10px; color:var(--mute); }
  .scroll { max-height:65vh; overflow:auto; }
  dialog { border:1px solid var(--line); border-radius:8px; padding:18px; min-width:340px; } dialog label { display:block; margin:8px 0 2px; color:var(--mute); }
  dialog input, dialog select { width:100%; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "X-Requested-With": "minipmc", "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch("/api/" + path, opt);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== "login") { me = null; if (path !== "me") render(); throw new Error("Please log in"); }
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
let me = null, tab = "dashboard", cache = {}, vmFilter = { q: "", provider: "", state: "" };
const RANK = { viewer: 0, operator: 1, admin: 2 };
const can = (role) => RANK[me.role] >= RANK[role];
const fmt = (t) => t ? t.replace("T", " ").replace("Z", " UTC") : "";
const opt = (o) => Array.isArray(o) ? h("option", { value: o[0] }, o[1]) : h("option", { value: o }, o);

function dialog(title, fields, onOk, okText) {
  const d = $("#dlg"), err = h("div", { class: "err" }), inputs = {};
  const body = fields.map((f) => {
    const el = f.type === "select" ? h("select", {}, f.options.map(opt)) : h("input", { type: f.type || "text", placeholder: f.placeholder || "" });
    if (f.value != null) el.value = f.value;
    inputs[f.name] = el;
    return [h("label", {}, f.label), el];
  });
  d.replaceChildren(h("h3", {}, title), body, err, h("div", { class: "bar", style: "margin-top:12px" },
    h("button", { class: "b", onclick: async () => {
      const v = {}; for (const k in inputs) v[k] = inputs[k].value;
      try { await onOk(v); d.close(); } catch (e) { err.textContent = e.message; }
    } }, okText || "OK"),
    h("button", { class: "b sec", onclick: () => d.close() }, "Cancel")));
  d.showModal();
}
const toast = (m) => alert(m);
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };

async function render() {
  const root = $("#app");
  if (!me) return root.replaceChildren(loginView());
  const tabs = [["dashboard", "Dashboard"], ["vms", "VMs"], ["schedules", "Schedules"], ["audit", "Audit log"]];
  if (can("admin")) tabs.push(["users", "Users"]);
  const view = h("main", {}, h("div", { class: "mute" }, "Loading..."));
  root.replaceChildren(
    h("header", {}, h("h1", {}, "Mini PMC"),
      h("nav", {}, tabs.map(([k, t]) => h("button", { class: k === tab ? "on" : "", onclick: () => { tab = k; render(); } }, t))),
      h("div", { class: "sp" }),
      h("span", {}, me.username + " (" + me.role + ")"),
      h("button", { class: "b sec sm", onclick: changePassword }, "Password"),
      h("button", { class: "b sec sm", onclick: guard(async () => { await api("logout", {}); me = null; render(); }) }, "Log out")),
    view);
  try { view.replaceChildren(...await VIEWS[tab]()); } catch (e) { view.replaceChildren(h("div", { class: "err" }, e.message)); }
}

function loginView() {
  const err = h("div", { class: "err" });
  const u = h("input", { placeholder: "Username", autofocus: true }), p = h("input", { type: "password", placeholder: "Password" });
  const go = async () => {
    try { me = await api("login", { username: u.value, password: p.value }); render(); } catch (e) { err.textContent = e.message; }
  };
  p.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  return h("div", { class: "panel login" }, h("h3", {}, "Mini PMC - sign in"), u, p, err, h("button", { class: "b", onclick: go }, "Sign in"));
}

function changePassword() {
  dialog("Change password", [{ name: "old", label: "Current password", type: "password" }, { name: "new", label: "New password (8+ characters)", type: "password" }],
    async (v) => { await api("change-password", v); toast("Password changed"); }, "Change");
}

// ------------------------------------------------------------------ views
async function dashboardView() {
  const s = await api("summary");
  const card = (n, l) => h("div", { class: "card" }, h("b", {}, n), h("span", {}, l));
  return [
    h("div", { class: "banner " + (s.paused ? "paused" : "live") }, s.paused ? "SCHEDULER PAUSED - nothing will be started or stopped" : "Scheduler active",
      can("operator") ? h("button", { class: "b sec sm", style: "float:right", onclick: guard(async () => {
        if (!confirm(s.paused ? "Resume the scheduler?" : "Pause the scheduler? No VM will be started or stopped until resumed.")) return;
        await api("pause", { paused: !s.paused }); render();
      }) }, s.paused ? "Resume" : "Pause") : null),
    h("div", { class: "cards" }, card(s.vms, "VMs"), card(s.azure, "Azure"), card(s.gcp, "GCP"), card(s.should_run, "should be running now"),
      card(s.should_stop, "should be stopped now"), card(s.held, "on hold (override)"), card(s.unmanaged, "unmanaged"), card(s.disabled, "disabled")),
    h("div", { class: "panel" }, h("h3", {}, "Holds ending within 14 days"),
      s.holds_ending_soon.length ? h("table", {}, h("tr", {}, h("th", {}, "VM"), h("th", {}, "Hold ends")),
        s.holds_ending_soon.map((x) => h("tr", {}, h("td", {}, x.name), h("td", {}, fmt(x.until))))) : h("span", { class: "mute" }, "None")),
    h("div", { class: "panel" }, h("h3", {}, "Needs attention"),
      s.problems.length ? h("table", {}, s.problems.map((x) => h("tr", {}, h("td", {}, h("span", { class: "tag " + (x.level === "ERROR" ? "bad" : "hold") }, x.level)), h("td", {}, x.message))))
        : h("span", { class: "mute" }, "Nothing")),
    h("div", { class: "mute" }, "Server time " + fmt(s.now_utc) + ". 'Should be' = what the schedule wants now, ignoring holds. Actual cloud state arrives with the collector (next step)."),
  ];
}

function holdDialog(vm) {
  dialog("Hold " + vm.name + " (scheduler will do nothing)", [
    { name: "mode", label: "Hold for", type: "select", options: [["days", "N days from now"], ["until", "Until a date (end of day UTC)"], ["forever", "Until a person clears it"]] },
    { name: "value", label: "Days, or date YYYY-MM-DD", placeholder: "e.g. 7 or 2026-12-31" },
    { name: "reason", label: "Reason (required)" }],
    async (v) => {
      const b = { name: vm.name, reason: v.reason };
      if (v.mode === "forever") b.forever = true; else if (v.mode === "until") b.until = v.value; else b.days = v.value;
      await api("hold/set", b); render();
    }, "Set hold");
}

async function vmsView() {
  const [{ vms }, { schedules }] = await Promise.all([api("vms"), api("schedules")]);
  cache.schedules = schedules;
  const out = h("div", {}), info = h("div", { class: "mute" });
  const draw = () => {
    const f = vmFilter, q = f.q.toLowerCase();
    const rows = vms.filter((v) => (!q || (v.name + " " + (v.schedule || "")).toLowerCase().includes(q)) && (!f.provider || v.provider === f.provider) &&
      (!f.state || (f.state === "held" && v.held) || (f.state === "unmanaged" && !v.schedule) || (f.state === "disabled" && !v.enabled) ||
        (f.state === "run" && v.says === "R") || (f.state === "stop" && v.says === "S")));
    info.textContent = rows.length + " of " + vms.length + " VMs" + (rows.length > 300 ? " (showing first 300 - narrow the filter)" : "");
    out.replaceChildren(h("div", { class: "panel scroll" }, h("table", {},
      h("tr", {}, ["VM", "Cloud", "Schedule", "Local now", "Should be", "Hold", ""].map((x) => h("th", {}, x))),
      rows.slice(0, 300).map((v) => h("tr", {},
        h("td", {}, v.name, v.enabled ? null : h("span", { class: "tag bad", style: "margin-left:6px" }, "disabled")),
        h("td", {}, v.provider), h("td", {}, v.schedule || h("span", { class: "tag bad" }, "unmanaged")), h("td", { class: "mute" }, v.local),
        h("td", {}, v.says ? h("span", { class: "tag " + (v.says === "R" ? "run" : "stop") }, v.says === "R" ? "running" : "stopped") : ""),
        h("td", {}, v.held ? h("span", { class: "tag hold", title: v.hold_reason + " (" + v.hold_by + ")" }, "HOLD until " + (v.hold_until ? fmt(v.hold_until) : "cleared")) : ""),
        h("td", {},
          can("operator") ? (v.held ? h("button", { class: "b sm sec", onclick: guard(async () => { await api("hold/clear", { name: v.name }); render(); }) }, "Clear hold")
            : h("button", { class: "b sm", onclick: () => holdDialog(v) }, "Hold")) : null,
          can("admin") ? [h("button", { class: "b sm sec", onclick: () => editVm(v) }, "Edit"),
            h("button", { class: "b sm red", onclick: guard(async () => { if (confirm("Remove " + v.name + " from Mini PMC? (The VM itself is not touched.)")) { await api("vm/remove", { name: v.name }); render(); } }) }, "Remove")] : null)))
    )));
  };
  const input = (k, el) => { el.value = vmFilter[k]; el.addEventListener("input", () => { vmFilter[k] = el.value; draw(); }); return el; };
  const bar = h("div", { class: "bar" },
    input("q", h("input", { placeholder: "Search VM or schedule", style: "min-width:260px" })),
    input("provider", h("select", {}, [["", "All clouds"], ["azure", "Azure"], ["gcp", "GCP"]].map(opt))),
    input("state", h("select", {}, [["", "All"], ["held", "On hold"], ["unmanaged", "Unmanaged"], ["disabled", "Disabled"], ["run", "Should run now"], ["stop", "Should be stopped now"]].map(opt))),
    can("admin") ? h("button", { class: "b", onclick: addVm }, "+ Add VM") : null, info);
  draw();
  return [bar, out];
}

function scheduleOptions(withNone) {
  return (withNone ? [["", "(none - unmanaged)"]] : []).concat(cache.schedules.map((s) => [s.name, s.name + " [" + s.vms + " VMs]"]));
}
function addVm() {
  dialog("Add VM", [
    { name: "name", label: "VM name" }, { name: "provider", label: "Cloud", type: "select", options: ["azure", "gcp"] },
    { name: "scope", label: "Azure subscription ID / GCP project" }, { name: "group", label: "Azure resource group / GCP zone" },
    { name: "schedule", label: "Schedule", type: "select", options: scheduleOptions(true) }, { name: "notes", label: "Notes" }],
    async (v) => { await api("vm/add", v); render(); }, "Add");
}
function editVm(vm) {
  dialog("Edit " + vm.name, [
    { name: "schedule", label: "Schedule", type: "select", options: scheduleOptions(true), value: vm.schedule || "" },
    { name: "enabled", label: "Managed by Mini PMC", type: "select", options: [["1", "Enabled"], ["0", "Disabled (scheduler ignores it)"]], value: vm.enabled ? "1" : "0" }],
    async (v) => { await api("vm/update", { name: vm.name, schedule: v.schedule, enabled: v.enabled === "1" }); render(); }, "Save");
}

async function schedulesView() {
  const { schedules } = await api("schedules");
  cache.schedules = schedules;
  const detail = h("div", {});
  return [
    can("admin") ? h("div", { class: "bar" }, h("button", { class: "b", onclick: () => dialog("New schedule from text", [
      { name: "text", label: "Schedule text", placeholder: "IST 10AM-6PM Mon-Fri" }, { name: "name", label: "Name (optional)" }],
      async (v) => { const r = await api("schedule/add", v); toast("Schedule ready: " + r.name); render(); }, "Create") }, "+ New schedule")) : null,
    h("div", { class: "panel scroll", style: "max-height:35vh" }, h("table", {}, h("tr", {}, ["Schedule", "Time zone", "VMs", ""].map((x) => h("th", {}, x))),
      schedules.map((s) => h("tr", {}, h("td", {}, s.name), h("td", {}, s.tz), h("td", {}, s.vms),
        h("td", {}, h("button", { class: "b sm sec", onclick: guard(() => showSchedule(s.name, detail)) }, "View")))))),
    detail];
}
async function showSchedule(name, box) {
  const s = await api("schedule?name=" + encodeURIComponent(name));
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], rows = [];
  rows.push(h("div", { class: "hours" }, h("span", {}), [...Array(24).keys()].map((i) => h("span", {}, i))));
  days.forEach((d, di) => rows.push(h("div", { class: "grid" }, h("i", { class: "l" }, d),
    [...Array(96).keys()].map((c) => h("i", { class: s.grid[di * 96 + c], title: d + " " + String(Math.floor(c / 4)).padStart(2, "0") + ":" + String((c % 4) * 15).padStart(2, "0") })))));
  box.replaceChildren(h("div", { class: "panel" }, h("h3", {}, s.name + "  (" + s.tz + ", local time)"), rows,
    h("div", { class: "mute" }, "Green = running, grey = stopped. Windows: " + s.windows.join("; "))));
}

async function auditView() {
  const q = h("input", { placeholder: "Filter by VM, user or action" }), box = h("div", {});
  const load = guard(async () => {
    const { events } = await api("events?limit=300&q=" + encodeURIComponent(q.value));
    box.replaceChildren(h("div", { class: "panel scroll" }, h("table", {}, h("tr", {}, ["Time (UTC)", "Who", "Action", "Target", "Detail"].map((x) => h("th", {}, x))),
      events.map((e) => h("tr", {}, h("td", {}, fmt(e.ts)), h("td", {}, e.actor), h("td", {}, e.action), h("td", {}, e.target), h("td", { class: "mute" }, e.detail))))));
  });
  q.addEventListener("change", load);
  const bar = h("div", { class: "bar" }, q, h("button", { class: "b sec", onclick: load }, "Refresh"));
  load();
  return [bar, box];
}

async function usersView() {
  const { users } = await api("users");
  return [h("div", { class: "bar" }, h("button", { class: "b", onclick: () => dialog("Add user", [
    { name: "username", label: "Username" }, { name: "password", label: "Password (8+ characters)", type: "password" },
    { name: "role", label: "Role", type: "select", options: ["viewer", "operator", "admin"] }],
    async (v) => { await api("user/save", { ...v, create: true }); render(); }, "Add") }, "+ Add user"),
    h("span", { class: "mute" }, "viewer = read only; operator = set/clear holds, pause; admin = everything")),
  h("div", { class: "panel" }, h("table", {}, h("tr", {}, ["User", "Role", "Status", ""].map((x) => h("th", {}, x))),
    users.map((u) => h("tr", {}, h("td", {}, u.username), h("td", {}, u.role), h("td", {}, u.disabled ? h("span", { class: "tag bad" }, "disabled") : "active"),
      h("td", {},
        h("button", { class: "b sm sec", onclick: () => dialog("Edit " + u.username, [
          { name: "role", label: "Role", type: "select", options: ["viewer", "operator", "admin"], value: u.role },
          { name: "password", label: "New password (leave blank to keep)", type: "password" }],
          async (v) => { const b = { username: u.username, role: v.role }; if (v.password) b.password = v.password; await api("user/save", b); render(); }, "Save") }, "Edit"),
        h("button", { class: "b sm sec", onclick: guard(async () => { await api("user/save", { username: u.username, disabled: !u.disabled }); render(); }) }, u.disabled ? "Enable" : "Disable"),
        h("button", { class: "b sm red", onclick: guard(async () => { if (confirm("Remove user " + u.username + "?")) { await api("user/remove", { username: u.username }); render(); } }) }, "Remove"))))))];
}

const VIEWS = { dashboard: dashboardView, vms: vmsView, schedules: schedulesView, audit: auditView, users: usersView };
api("me").then((m) => { me = m; }).catch(() => {}).finally(render);
</script>
</body>
</html>
